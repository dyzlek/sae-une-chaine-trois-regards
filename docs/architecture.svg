<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img" aria-label="Architecture technique de noeud-c : trois processus isolés (serveur application, nœud blockchain, worker IA), SQLite WAL, pairs Tailscale et OpenRouter">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#133C59"/>
    </marker>
    <marker id="arr-lagon" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#2A8F96"/>
    </marker>
    <marker id="arr-magma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#D95D18"/>
    </marker>
  </defs>

  <!-- Fond clair propre pour PDF -->
  <rect width="1120" height="520" fill="#F8F7F3" rx="8"/>

  <!-- Titre -->
  <text x="28" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#08111D">Architecture technique · Binôme 3 (noeud-c)</text>
  <text x="28" y="58" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#4F6475">Trois processus Node.js 24 isolés · SQLite en mode WAL · Zéro build frontend · Spec commune v1.1</text>

  <!-- Zone Machine noeud-c -->
  <rect x="295" y="84" width="520" height="404" rx="10" fill="#FFFFFF" stroke="#133C59" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="312" y="72" width="230" height="24" rx="4" fill="#133C59"/>
  <text x="427" y="88" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" font-weight="600" fill="#F1F5F9">MACHINE LOCALE · noeud-c</text>

  <!-- Visiteur + Navigateur (Gauche) -->
  <rect x="28" y="130" width="210" height="116" rx="8" fill="#FFFFFF" stroke="#133C59" stroke-width="1.6"/>
  <rect x="28" y="130" width="210" height="28" rx="8" fill="#133C59"/>
  <rect x="28" y="148" width="210" height="10" fill="#133C59"/>
  <text x="133" y="149" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F1F5F9">Navigateur (Visiteur)</text>
  <text x="133" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#08111D">Application web native</text>
  <text x="133" y="198" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#4F6475">HTML / CSS / JS · importmap</text>
  <text x="133" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#2A8F96">Œuvre 3D Three.js (WebGL)</text>

  <!-- Processus 1 : Serveur Application -->
  <rect x="320" y="114" width="215" height="108" rx="8" fill="#F0F8F9" stroke="#2A8F96" stroke-width="1.8"/>
  <text x="332" y="134" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700" fill="#2A8F96">PROCESSUS 1</text>
  <text x="332" y="154" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#08111D">Serveur d'application</text>
  <text x="332" y="174" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#133C59">Express 5 · 127.0.0.1:3000</text>
  <text x="332" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#4F6475">SSE (500 ms), masquage serveur,</text>
  <text x="332" y="207" font-family="system-ui, sans-serif" font-size="11" fill="#4F6475">valeurs locales (lexique l2)</text>

  <!-- Processus 2 : Nœud Blockchain -->
  <rect x="575" y="114" width="220" height="122" rx="8" fill="#EEF4FA" stroke="#133C59" stroke-width="1.8"/>
  <text x="587" y="134" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700" fill="#133C59">PROCESSUS 2</text>
  <text x="587" y="154" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#08111D">Nœud blockchain</text>
  <text x="587" y="174" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#133C59">Spec v1.1 · Tailscale :8080</text>
  <text x="587" y="191" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#4F6475">API interne · 127.0.0.1:8081</text>
  <text x="587" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#4F6475">Filtre entrée, Ed25519, créneaux</text>
  <text x="587" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#4F6475">20 s, sondage 10 s, SYNCING</text>

  <!-- Base SQLite WAL (Centre bas) -->
  <rect x="320" y="346" width="215" height="118" rx="8" fill="#FFFBF0" stroke="#C6922B" stroke-width="1.8"/>
  <text x="332" y="366" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700" fill="#9A6B16">STOCKAGE PARTAGÉ</text>
  <text x="332" y="386" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#08111D">SQLite (mode WAL)</text>
  <text x="332" y="406" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#133C59">data/node-{chaine}.db</text>
  <text x="332" y="424" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#4F6475">blocks · messages · node_state</text>
  <text x="332" y="440" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#4F6475">ai_results · events · peers_log</text>
  <text x="332" y="455" font-family="system-ui, sans-serif" font-size="10.5" fill="#9A6B16">busy_timeout = 5000 ms</text>

  <!-- Processus 3 : Worker IA -->
  <rect x="575" y="346" width="220" height="118" rx="8" fill="#FFF4EE" stroke="#D95D18" stroke-width="1.8"/>
  <text x="587" y="366" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700" fill="#D95D18">PROCESSUS 3 (ISOLÉ)</text>
  <text x="587" y="386" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#08111D">Worker IA</text>
  <text x="587" y="406" font-family="system-ui, sans-serif" font-size="11" fill="#4F6475">Lots de 10 (≤ 1 req / 30 s)</text>
  <text x="587" y="422" font-family="system-ui, sans-serif" font-size="11" fill="#4F6475">Compteur 50 req/j · prompt p2</text>
  <text x="587" y="438" font-family="system-ui, sans-serif" font-size="11" fill="#4F6475">Chaîne réelle uniquement</text>
  <text x="587" y="454" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#D95D18">Export JSON data/exports/</text>

  <!-- Pairs Tailscale (Haut droite) -->
  <rect x="875" y="114" width="215" height="122" rx="8" fill="#FFFFFF" stroke="#133C59" stroke-width="1.6"/>
  <rect x="875" y="114" width="215" height="28" rx="8" fill="#133C59"/>
  <rect x="875" y="132" width="215" height="10" fill="#133C59"/>
  <text x="982" y="133" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F1F5F9">Réseau privé Tailscale</text>
  <text x="982" y="166" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" fill="#0284C7">▲ noeud-a (Binôme 1)</text>
  <text x="982" y="188" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" fill="#B45309">■ noeud-b (Binôme 2)</text>
  <text x="982" y="216" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#4F6475">HTTP + JSON · port 8080</text>

  <!-- OpenRouter (Bas droite) -->
  <rect x="875" y="346" width="215" height="118" rx="8" fill="#FFFFFF" stroke="#D95D18" stroke-width="1.6"/>
  <rect x="875" y="346" width="215" height="28" rx="8" fill="#D95D18"/>
  <rect x="875" y="364" width="215" height="10" fill="#D95D18"/>
  <text x="982" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">OpenRouter (Free)</text>
  <text x="982" y="396" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#08111D">openrouter/free</text>
  <text x="982" y="416" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#4F6475">data_collection: "deny"</text>
  <text x="982" y="436" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4F6475">20 req/min · 50 req/j</text>
  <text x="982" y="452" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#4F6475">HTTPS · port 443</text>

  <!-- FLÈCHES -->
  <!-- Navigateur <-> Serveur App -->
  <line x1="238" y1="170" x2="317" y2="170" stroke="#2A8F96" stroke-width="2" marker-start="url(#arr-lagon)" marker-end="url(#arr-lagon)"/>
  <text x="278" y="160" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#2A8F96">HTTP + SSE</text>

  <!-- Serveur App -> Nœud (API interne) -->
  <line x1="535" y1="168" x2="572" y2="168" stroke="#133C59" stroke-width="2" marker-end="url(#arr)"/>
  <text x="554" y="158" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="9.5" fill="#133C59">:8081</text>

  <!-- Serveur App -> SQLite (Lecture) -->
  <line x1="427" y1="222" x2="427" y2="343" stroke="#2A8F96" stroke-width="2" marker-end="url(#arr-lagon)"/>
  <text x="419" y="286" text-anchor="end" font-family="system-ui, sans-serif" font-size="10.5" fill="#2A8F96">lecture +</text>
  <text x="419" y="300" text-anchor="end" font-family="system-ui, sans-serif" font-size="10.5" fill="#2A8F96">events</text>

  <!-- Nœud <-> SQLite -->
  <path d="M 620 236 L 620 288 L 485 288 L 485 343" fill="none" stroke="#133C59" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="556" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#133C59">chaîne · file · état</text>

  <!-- Worker IA <-> SQLite -->
  <line x1="572" y1="405" x2="538" y2="405" stroke="#D95D18" stroke-width="2" marker-start="url(#arr-magma)" marker-end="url(#arr-magma)"/>

  <!-- Nœud <-> Tailscale -->
  <line x1="798" y1="175" x2="872" y2="175" stroke="#133C59" stroke-width="2.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="835" y="164" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#133C59">/api/v1</text>

  <!-- Worker IA <-> OpenRouter -->
  <line x1="798" y1="405" x2="872" y2="405" stroke="#D95D18" stroke-width="2.2" marker-start="url(#arr-magma)" marker-end="url(#arr-magma)"/>
  <text x="835" y="394" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#D95D18">HTTPS 443</text>

  <!-- Légende bas gauche -->
  <text x="28" y="486" font-family="system-ui, sans-serif" font-size="11" fill="#4F6475">Isolation : une panne ou lenteur du Worker IA ne bloque jamais le Nœud ni l'Application.</text>
</svg>
